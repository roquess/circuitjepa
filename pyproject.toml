[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitjepa"
version = "0.1.0"
description = "Quantum Joint-Embedding Predictive Architecture"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "qiskit>=1.2",
    "qiskit-aer",
    "qiskit-ibm-runtime",
    "torch",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
circuitjepa = "circuitjepa.cli:main"

[tool.setuptools]
packages = ["circuitjepa"]
