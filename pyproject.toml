[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitjepa"
version = "0.1.0"
description = "A fully circuit-based Joint-Embedding Predictive Architecture for quantum dynamics"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Steve Roques" }]
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer",
    "qiskit-ibm-runtime",
    "torch",
    "numpy",
    "scipy",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/roquess/circuitjepa"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
circuitjepa = "circuitjepa.cli:main"

[tool.setuptools]
packages = ["circuitjepa"]
